name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The repo root is the site: no build step. .nojekyll at the root keeps
      # Pages from dropping _ds_bundle.js for its leading underscore.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # A large upload is not listed at once; deploying straight after it fails with
      # "No artifacts named github-pages were found".
      - name: Wait for the upload to be listed
        run: sleep 30

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
