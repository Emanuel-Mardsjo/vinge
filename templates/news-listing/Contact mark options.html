<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact mark options</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./contactMarks.js"></script>
<style>body{margin:0;background:var(--paper);color:var(--ink)}a{color:var(--ink)}a:hover{color:var(--text-secondary)}.wrap{max-width:1280px;margin:0 auto;padding:var(--space-6) var(--margin)}.grid6{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--space-6) var(--gutter);margin-top:var(--space-6)}.opt{display:flex;flex-direction:column;gap:var(--space-3);padding-top:var(--space-4);border-top:1px solid var(--rule-hairline)}.stage{width:100%;max-width:220px;margin:var(--space-4) auto}.row{display:flex;gap:var(--space-3);flex-wrap:wrap}.row button{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-size:var(--text-small);color:var(--text-secondary);text-decoration:underline;text-decoration-color:var(--underline-rest-secondary);text-underline-offset:.22em}.row button[aria-pressed="true"]{color:var(--ink);text-decoration-color:var(--ink)}.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-2)}.strip div{display:flex;flex-direction:column;align-items:center;gap:6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const STATES = ['idle', 'typing', 'ready', 'sent'];
const LABEL = { idle: 'Empty', typing: 'Typing', ready: 'Can send', sent: 'Sent' };
function Option({ id, c, step, replay }) {
  const { Mark } = window.VingeDesignSystem_8582c7;
  const st = STATES[step];
  return (
    <div className="opt">
      <p className="small" style={{ margin: 0, color: 'var(--text-secondary)' }}>{id}</p>
      <h2 className="display-3" style={{ margin: 0 }}>{c.label}</h2>
      <p className="small" style={{ margin: 0, color: 'var(--text-secondary)' }}>{c.idea}</p>
      <div className="stage"><Mark name={id} stroke={0.9} state={c.states[st]} replay={replay} /></div>
      <div className="strip">
        {STATES.map((s) => (
          <div key={s}><div style={{ width: '100%', maxWidth: 56 }}><Mark name={id} stroke={0.9} state={s === 'sent' ? {} : c.states[s]} /></div><span className="small" style={{ color: s === st ? 'var(--ink)' : 'var(--text-secondary)' }}>{LABEL[s]}</span></div>
        ))}
      </div>
    </div>
  );
}
function App() {
  const [ready, setReady] = React.useState(!!window.VingeContactMarksReady);
  const [step, setStep] = React.useState(0);
  const [auto, setAuto] = React.useState(true);
  const [replay, setReplay] = React.useState(0);
  React.useEffect(() => { const f = () => setReady(true); window.addEventListener('vinge-contact-marks', f); return () => window.removeEventListener('vinge-contact-marks', f); }, []);
  React.useEffect(() => {
    if (!auto) return;
    const t = setInterval(() => setStep((s) => { const n = (s + 1) % 4; if (n === 3) setReplay((r) => r + 1); return n; }), 1600);
    return () => clearInterval(t);
  }, [auto]);
  const go = (i) => { setAuto(false); setStep(i); if (i === 3) setReplay((r) => r + 1); };
  if (!ready) return null;
  const C = window.VingeContactMarks;
  return (
    <div className="wrap">
      <h1 className="display-2" style={{ margin: 0 }}>Contact: six candidate marks</h1>
      <p className="small" style={{ marginTop: 'var(--space-3)', maxWidth: '64ch', color: 'var(--text-secondary)' }}>Each mark follows the subscribe form through four states. The parts travel only along their own axes, and the "Can send" state is the mark at rest. Pick one and it moves into the library; the rest are removed. Try any of them in the News listing under Tweaks → contactMark.</p>
      <div className="row" style={{ marginTop: 'var(--space-4)' }}>
        <button aria-pressed={auto} onClick={() => setAuto(true)}>Play</button>
        {STATES.map((s, i) => <button key={s} aria-pressed={!auto && step === i} onClick={() => go(i)}>{LABEL[s]}</button>)}
      </div>
      <div className="grid6">
        {Object.keys(C).map((id) => <Option key={id} id={id} c={C[id]} step={step} replay={replay} />)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
